<style>
    .api-detail-page {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .api-detail-topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border-radius: 18px;
        padding: 10px 14px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .api-detail-back {
        width: 34px; height: 34px; border-radius: 10px;
        background: #faf7f2; border: none;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
    }
    .api-detail-back:active { background: #e8e3d9; }
    .api-detail-back svg { width: 18px; height: 18px; color: #8b7355; }

    .api-detail-title { flex: 1; font-size: 18px; font-weight: 700; }

    .api-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .api-list-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .api-list-item:active { background: #f9f6f0; }

    .api-method {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 6px;
        letter-spacing: 1px;
    }

    .method-get  { background: #e8f5e9; color: #2e7d32; }
    .method-post { background: #e3f2fd; color: #1565c0; }

    .api-name { flex: 1; font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .api-arrow { color: #c4b8a5; font-size: 16px; }
</style>
