<!-- Home_Admin_Config.html -->
<style>
    .config-page {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .config-card {
        background: #fff;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .config-title {
        font-size: 14px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(0,0,0,0.06);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .config-title-icon {
        font-size: 16px;
    }

    .config-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
    }

    .config-row + .config-row {
        border-top: 1px solid rgba(0,0,0,0.04);
    }

    .config-label {
        font-size: 13px;
        color: #1a1a1a;
        font-weight: 500;
    }

    .config-hint {
        font-size: 10px;
        color: #b8a48c;
        display: block;
        margin-top: 1px;
    }

    /* Toggle Switch */
    .toggle {
        position: relative;
        width: 44px;
        height: 26px;
        flex-shrink: 0;
    }

    .toggle input {
        display: none;
    }

    .toggle-slider {
        position: absolute;
        inset: 0;
        background: #d4c8b8;
        border-radius: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .toggle-slider::before {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        transition: all 0.3s ease;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .toggle input:checked + .toggle-slider {
        background: #c84628;
    }

    .toggle input:checked + .toggle-slider::before {
        transform: translateX(18px);
    }

    /* Input */
    .config-input {
        width: 80px;
        padding: 6px 10px;
        border: 1.5px solid #e0d5c1;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        color: #1a1a1a;
        background: #faf7f2;
        outline: none;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .config-input:focus {
        border-color: #c84628;
        box-shadow: 0 0 0 3px rgba(200,70,40,0.06);
    }

    .config-input-wide {
        width: 100%;
        text-align: left;
    }

    /* Button */
    .btn-save {
        width: 100%;
        padding: 14px;
        background: #c84628;
        color: #fff;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 1px;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .btn-save:active {
        transform: scale(0.97);
    }

    .btn-save:disabled {
        opacity: 0.5;
        pointer-events: none;
    }

    /* Toast */
    .toast-inline {
        text-align: center;
        padding: 10px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        display: none;
        margin-top: 10px;
    }

    .toast-inline.success {
        background: #e8f5e9;
        color: #2e7d32;
        display: block;
    }

    .toast-inline.error {
        background: #fef2f2;
        color: #c84628;
        display: block;
    }
</style>

<div class="config-page" id="ConfigPage">

<!-- 返回栏 -->
<div class="config-card" style="display:flex;align-items:center;gap:12px;padding:12px 16px;">
    <button class="admin-back" onclick="parent.loadSubPage('Home_Admin.html')" style="width:34px;height:34px;border-radius:10px;background:#faf7f2;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8b7355" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </button>
    <span style="font-size:15px;font-weight:600;color:#1a1a1a;">配置</span>
</div>

    <!-- 1. 用户相关 -->
    <div class="config-card">
        <div class="config-title">
            <span class="config-title-icon">👤</span> 用户相关
        </div>

        <div class="config-row">
            <span class="config-label">登录开关</span>
            <label class="toggle">
                <input type="checkbox" id="LoginSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">注册开关</span>
            <label class="toggle">
                <input type="checkbox" id="RegisterSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">改名开关</span>
            <label class="toggle">
                <input type="checkbox" id="ChangeNameSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">改昵称开关</span>
            <label class="toggle">
                <input type="checkbox" id="ChangeNickSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">换头像开关</span>
            <label class="toggle">
                <input type="checkbox" id="ChangeAvatarSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">API修改积分/会员/称号</span>
            <label class="toggle">
                <input type="checkbox" id="ApiScoreSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">子用户密码哈希<span class="config-hint">开启后子用户密码以 bcrypt 存储</span></span>
            <label class="toggle">
                <input type="checkbox" id="SubPwdHash" >
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="config-row">
            <span class="config-label">名字长度<span class="config-hint">最小 / 最大</span></span>
            <div style="display:flex;align-items:center;gap:4px;">
                <input type="number" class="config-input" id="NameMinLen"  style="width:60px;" min="2" max="50">
                <span style="color:#ccc;">/</span>
                <input type="number" class="config-input" id="NameMaxLen"  style="width:60px;" min="2" max="50">
            </div>
        </div>
        <div class="config-row">
            <span class="config-label">密码长度<span class="config-hint">最小 / 最大</span></span>
            <div style="display:flex;align-items:center;gap:4px;">
                <input type="number" class="config-input" id="PwdMinLen"  style="width:60px;" min="4" max="100">
                <span style="color:#ccc;">/</span>
                <input type="number" class="config-input" id="PwdMaxLen"  style="width:60px;" min="4" max="100">
            </div>
        </div>
        <div class="config-row">
            <span class="config-label">昵称长度<span class="config-hint">最小 / 最大</span></span>
            <div style="display:flex;align-items:center;gap:4px;">
                <input type="number" class="config-input" id="NickMinLen"  style="width:60px;" min="1" max="50">
                <span style="color:#ccc;">/</span>
                <input type="number" class="config-input" id="NickMaxLen"  style="width:60px;" min="1" max="50">
            </div>
        </div>
        <div class="config-row">
            <span class="config-label">同IP最多注册次数</span>
            <input type="number" class="config-input" id="IpRegisterLimit"  min="1" max="999">
        </div>
        <div class="config-row">
            <span class="config-label">注册赠送积分</span>
            <input type="number" class="config-input" id="RegisterGold"  min="0">
        </div>
        <div class="config-row">
            <span class="config-label">注册赠送经验</span>
            <input type="number" class="config-input" id="RegisterExp"  min="0">
        </div>
        <div class="config-row">
            <span class="config-label">注册赠送VIP<span class="config-hint">单位：分钟</span></span>
            <input type="number" class="config-input" id="RegisterVipMinutes"  min="0">
        </div>
        <div class="config-row">
            <span class="config-label">签到获得积分</span>
            <input type="number" class="config-input" id="SignGold"  min="0">
        </div>
        <div class="config-row">
            <span class="config-label">签到获得经验</span>
            <input type="number" class="config-input" id="SignExp"  min="0">
        </div>
    </div>

    <!-- 2. 卡密相关 -->
    <div class="config-card">
        <div class="config-title">
            <span class="config-title-icon">🔑</span> 卡密相关
        </div>
        <div class="config-row">
            <span class="config-label">卡密长度</span>
            <input type="number" class="config-input" id="CardkeyLength"  min="4" max="50">
        </div>
        <div class="config-row">
            <span class="config-label">卡密类型</span>
            <select class="config-input" id="CardkeyType"  style="width:auto;padding:6px 8px;">
                <option value="0">全部(数字+字母)</option>
                <option value="1">纯数字</option>
                <option value="2">纯字母</option>
            </select>
        </div>
        <div class="config-row">
            <span class="config-label">API兑换卡密</span>
            <label class="toggle">
                <input type="checkbox" id="CardkeyApiSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">API生成卡密</span>
            <label class="toggle">
                <input type="checkbox" id="CardkeyGenerateSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>


    <!-- 4. 文档 -->
    <div class="config-card">
        <div class="config-title">
            <span class="config-title-icon">📄</span> 文档相关
        </div>
        <div class="config-row">
            <span class="config-label">API修改文档</span>
            <label class="toggle">
                <input type="checkbox" id="DocsApiSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <!-- 5. 统计 -->
    <div class="config-card">
        <div class="config-title">
            <span class="config-title-icon">📊</span> 统计相关
        </div>
        <div class="config-row">
            <span class="config-label">统计开关</span>
            <label class="toggle">
                <input type="checkbox" id="StatsSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <!-- 6. 服务器 -->
    <div class="config-card">
        <div class="config-title">
            <span class="config-title-icon">🖥️</span> 服务器相关
        </div>
        <div class="config-row">
            <span class="config-label">服务器状态</span>
            <select class="config-input" id="ServerStatus"  style="width:auto;padding:6px 8px;">
                <option value="0">正常</option>
                <option value="1">维护中</option>
            </select>
        </div>
        <div class="config-row">
            <span class="config-label">ApiTokey验证开关</span>
            <label class="toggle">
                <input type="checkbox" id="ApiTokenSwitch" >
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="config-row">
            <span class="config-label">API Token</span>
            <input type="text" class="config-input config-input-wide" id="ApiToken"  maxlength="21" style="text-align:left;">
        </div>
        <div class="config-row">
            <span class="config-label">Tokey</span>
            <input type="text" class="config-input config-input-wide" id="Tokey"  maxlength="64" style="text-align:left;">
        </div>
    </div>

    <!-- Save -->
    <button class="btn-save" id="BtnSave" onclick="parent.saveConfig()">保存配置</button>
    <div class="toast-inline" id="ConfigToast"></div>

</div>
