<!-- Home_Admin_Custom_Ranking.html -->
<style>
    .ranking-page { display: flex; flex-direction: column; gap: 14px; }
    .ranking-topbar { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; padding: 10px 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .ranking-back { width: 34px; height: 34px; border-radius: 10px; background: #faf7f2; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ranking-back:active { background: #e8e3d9; }
    .ranking-back svg { width: 18px; height: 18px; color: #8b7355; }
    .ranking-title { flex: 1; font-size: 18px; font-weight: 700; }

    .ranking-card { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .card-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f0ebe0; }
    .rank-item { padding: 8px 0; border-bottom: 1px solid #f5f0e8; }
    .rank-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .rank-var-name { font-weight: 600; font-size: 13px; color: #1a1a1a; }
    .rank-more { font-size: 11px; color: #4f6ef7; cursor: pointer; }
    .rank-row { font-size: 11px; color: #8b7355; margin-left: 8px; line-height: 1.6; }
    .empty-text { color: #b8a48c; font-size: 12px; padding: 8px 0; }
</style>

<div class="ranking-page">
    <div class="ranking-topbar">
        <button class="ranking-back" onclick="parent.loadSubPage('Home_Admin_Custom.html')">
            <svg viewBox="0 0 24 24" fill="none" stroke="#8b7355" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="ranking-title">自定义变量/JSON排行榜</span>
    </div>

    <div class="ranking-card">
        <div class="card-title">📝 自定义变量排行</div>
        <div id="VarRanking">加载中...</div>
    </div>

    <div class="ranking-card">
        <div class="card-title">📋 自定义JSON排行</div>
        <div id="TableRanking">加载中...</div>
    </div>
</div>
