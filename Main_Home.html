<!-- Main_Home.html -->
<style>
    .section-title {
        font-size: 13px;
        font-weight: 600;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin: 20px 0 14px 6px;
    }
    .section-title:first-child {
        margin-top: 0;
    }

    .card-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border-radius: 18px;
        padding: 18px 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        transform: rotate(0.6deg);
        transition: all 0.3s ease;
        cursor: pointer;
        min-height: 80px;
        -webkit-tap-highlight-color: transparent;
        outline: none;
        text-decoration: none;
        color: inherit;
    }
    .card:hover {
        transform: rotate(0deg) translateY(-4px);
        box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
    .card:active {
        transform: rotate(0deg) scale(0.97);
    }

    .card-icon {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }
    .card-icon.c-admin  { background:#eef1ff; color:#4f6ef7; }
    .card-icon.c-api    { background:#e8f5e9; color:#43a047; }
    .card-icon.c-project{ background:#fff3e0; color:#ef6c00; }
    .card-icon.c-file   { background:#e3f2fd; color:#1e88e5; }
    .card-icon.c-msg    { background:#fce4ec; color:#e91e63; }

    .card-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
    }
    .card-label {
        font-size: 14px;
        font-weight: 600;
        color: #1a1a1a;
        line-height: 1.2;
    }
    .card-sub {
        font-size: 11px;
        color: #666;
        line-height: 1.3;
    }
</style>

<div class="section-title">Mainly</div>
<div class="card-grid">
 <div class="card" onclick="parent.loadSubPage('Home_Admin.html')">
        <div class="card-icon c-admin">👤</div>
        <div class="card-text">
            <span class="card-label">Admin</span>
            <span class="card-sub">用户管理</span>
        </div>
    </div>
 <div class="card" onclick="parent.loadSubPage('Home_Admin_API.html')">
        <div class="card-icon c-api">⚡</div>
        <div class="card-text">
            <span class="card-label">API</span>
            <span class="card-sub">API接口文档</span>
        </div>
    </div>
    <div class="card" onclick="parent.navigateTo('project')">
        <div class="card-icon c-project">📦</div>
        <div class="card-text">
            <span class="card-label">Project</span>
            <span class="card-sub">项目</span>
        </div>
    </div>
    <div class="card" onclick="parent.navigateTo('file')">
        <div class="card-icon c-file">📁</div>
        <div class="card-text">
            <span class="card-label">File</span>
            <span class="card-sub">文件管理</span>
        </div>
    </div>
</div>

<div class="section-title">Other Serve</div>
<div class="card-grid">
    <div class="card" onclick="parent.navigateTo('message')">
        <div class="card-icon c-msg">💬</div>
        <div class="card-text" onclick="window.open('http://7lq.top', '_blank')">
            <span class="card-label">作者的话</span>
            <span class="card-sub">Onclick Me</span>
        </div>
    </div>
</div>
